      <stop offset="0%" stop-color="#14112e" />
      <stop offset="60%" stop-color="#070614" />
      <stop offset="100%" stop-color="#03020a" />
    </radialGradient>
    <linearGradient id="logo-emblem-bg" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9a82ff"/>
      <stop offset=".55" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#5a2fe6"/>
    </linearGradient>
  </defs>
  
  <!-- Backdrop -->
